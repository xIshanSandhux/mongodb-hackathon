services:
  gateway:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      PAYMENTS_URL: http://payments:8101
      CUSTOMERS_URL: http://customers:8102
      VENDORS_URL: http://vendors:8103
      RISK_URL: http://risk:8104
      LEDGER_URL: http://ledger:8105
      NOTIFICATIONS_URL: http://notifications:8106
      REPORTING_URL: http://reporting:8107
    depends_on:
      payments: { condition: service_healthy }
      customers: { condition: service_healthy }
      vendors: { condition: service_healthy }
      risk: { condition: service_healthy }
      ledger: { condition: service_healthy }
      notifications: { condition: service_healthy }
      reporting: { condition: service_healthy }
  payments:
    build: .
    command: uvicorn app.services.payments.main:app --host 0.0.0.0 --port 8101
    expose: ["8101"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"], interval: 5s, timeout: 2s, retries: 10 }
  customers:
    build: .
    command: uvicorn app.services.customers.main:app --host 0.0.0.0 --port 8102
    expose: ["8102"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/health')"], interval: 5s, timeout: 2s, retries: 10 }
  vendors:
    build: .
    command: uvicorn app.services.vendors.main:app --host 0.0.0.0 --port 8103
    expose: ["8103"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/health')"], interval: 5s, timeout: 2s, retries: 10 }
  risk:
    build: .
    command: uvicorn app.services.risk.main:app --host 0.0.0.0 --port 8104
    expose: ["8104"]
    environment:
      VENDORS_URL: http://vendors:8103
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8104/health')"], interval: 5s, timeout: 2s, retries: 10 }
  ledger:
    build: .
    command: uvicorn app.services.ledger.main:app --host 0.0.0.0 --port 8105
    expose: ["8105"]
    environment:
      PAYMENTS_URL: http://payments:8101
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8105/health')"], interval: 5s, timeout: 2s, retries: 10 }
  notifications:
    build: .
    command: uvicorn app.services.notifications.main:app --host 0.0.0.0 --port 8106
    expose: ["8106"]
    environment:
      CUSTOMERS_URL: http://customers:8102
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8106/health')"], interval: 5s, timeout: 2s, retries: 10 }
  reporting:
    build: .
    command: uvicorn app.services.reporting.main:app --host 0.0.0.0 --port 8107
    expose: ["8107"]
    environment:
      PAYMENTS_URL: http://payments:8101
      LEDGER_URL: http://ledger:8105
      NOTIFICATIONS_URL: http://notifications:8106
    depends_on:
      payments: { condition: service_healthy }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8107/health')"], interval: 5s, timeout: 2s, retries: 10 }
